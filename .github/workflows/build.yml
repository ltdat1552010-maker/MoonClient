
name: Build MoonClient

on:
  workflow_dispatch:
  push:
    paths:
      - 'moonclient-src.tgz'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: |
          mkdir source
          tar -xzf moonclient-src.tgz -C source
          find source -type f | head -40

      - name: Build JAR
        run: |
          cd source
          DIR=$(find . -name build.gradle -printf '%h\n' | head -1)
          cd "$DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MoonClient-JAR
          path: source/**/build/libs/*.jar
          if-no-files-found: error
